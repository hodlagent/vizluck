<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vizluck — Bitcoin Puzzle Lottery</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <!-- ── Top bar ─────────────────────────────────────────────── -->
      <header class="topbar">
        <div class="brand">vizluck</div>
        <div class="controls">
          <select id="puzzle-select" class="select" title="Choose a puzzle">
            <option value="">— custom range —</option>
          </select>

          <input
            id="range-input"
            class="input"
            type="text"
            placeholder="start_hex:end_hex  (e.g. 800000000000000000:ffffffffffffffffff)"
            autocomplete="off"
            spellcheck="false"
          />

          <button id="btn-random" class="btn" title="Generate one random key">
            🎲 Random
          </button>
          <button id="btn-auto" class="btn" title="Auto-randomize (click again to stop)">
            ▶ Auto
          </button>
        </div>
        <div id="error" class="error" hidden></div>
      </header>

      <!-- ── Grid ────────────────────────────────────────────────── -->
      <main class="main">
        <section class="grid-wrap">
          <div id="grid" class="grid"></div>
        </section>

        <!-- ── Bottom info cards ──────────────────────────────────── -->
        <section class="info" id="info"></section>
      </main>

      <!-- ── Toast ───────────────────────────────────────────────── -->
      <div id="toast" class="toast" hidden>copied</div>
    </div>
  </body>
</html>
